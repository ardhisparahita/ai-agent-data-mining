services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-database

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_ROOT_PASS}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - ecommerce-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "${APP_PORT}:${APP_PORT}"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data:
